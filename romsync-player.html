<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ロムシンク - 配信VOD振り返りツール</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #twitch-embed { width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="twitch-embed"></div>
  <script src="https://player.twitch.tv/js/embed/v1.js"></script>

  <script type="text/javascript">
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('video') || '2908396731';

    const player = new Twitch.Player("twitch-embed", {
      width: "100%",
      height: "100%",
      video: videoId,
      autoplay: false,
      parent: [window.location.hostname]
    });

    // 親からのシーク命令を受信
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (data && data.type === 'SEEK') {
        const targetSec = data.seconds;
        if (typeof targetSec === 'number' && player) {
          player.seek(targetSec);
          player.play();
        }
      }
    });

    // 現在の再生位置を親へ定期送信 (0.5秒おき)
    setInterval(() => {
      if (player && typeof player.getCurrentTime === 'function') {
        const currentSec = player.getCurrentTime();
        if (!isNaN(currentSec)) {
          window.parent.postMessage({
            type: 'TIME_UPDATE',
            currentTime: currentSec
          }, '*');
        }
      }
    }, 500);
  </script>
</body>
</html>
